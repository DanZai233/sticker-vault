<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' file: data:; style-src 'self'; script-src 'self'"
    />
    <title>快捷表情</title>
    <link rel="stylesheet" href="panel.css" />
    <link rel="stylesheet" href="card-actions.css" />
  </head>
  <body>
    <header><b>表情仓</b><button id="open-main">打开素材库 ↗</button></header>
    <input id="search" aria-label="搜索表情" placeholder="搜索表情、标签…" />
    <nav>
      <button data-filter="recent" class="active">最近使用</button
      ><button data-filter="favorite">常用</button><button data-filter="all">全部</button>
    </nav>
    <p id="count" role="status"></p>
    <div id="items"></div>
    <p id="empty" class="empty" hidden></p>
    <footer id="hint" role="status">点击使用原文件</footer>
    <script src="virtual-grid.js"></script>
    <script src="card-actions.js"></script>
    <script src="panel.js"></script>
  </body>
</html>
