name: Build desktop installers
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: ${{ matrix.platform }}-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, platform: darwin, flag: mac, arch: arm64 }
          - { os: macos-15-intel, platform: darwin, flag: mac, arch: x64 }
          - { os: windows-latest, platform: win32, flag: win, arch: x64 }
          - { os: windows-latest, platform: win32, flag: win, arch: arm64 }
          - { os: ubuntu-24.04, platform: linux, flag: linux, arch: x64 }
          - { os: ubuntu-24.04-arm, platform: linux, flag: linux, arch: arm64 }
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      BUILD_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Platform UI regression (Windows and macOS)
        if: matrix.platform != 'linux'
        run: npm run test:platform-ui
      - name: Platform UI regression (Linux)
        if: matrix.platform == 'linux'
        run: xvfb-run -a ./node_modules/.bin/electron --no-sandbox scripts/test-platform-ui.cjs
      - name: Portable backup and manual sync integration (Windows and macOS)
        if: matrix.platform != 'linux'
        run: npm run test:backup-engine
      - name: Portable backup and manual sync integration (Linux)
        if: matrix.platform == 'linux'
        run: xvfb-run -a ./node_modules/.bin/electron --no-sandbox scripts/test-backup-engine.cjs
      - name: Desktop IPC and recoverable trash flow (Windows and macOS)
        if: matrix.platform != 'linux'
        run: npm run test:desktop
      - name: Desktop IPC and recoverable trash flow (Linux)
        if: matrix.platform == 'linux'
        run: xvfb-run -a npm run test:desktop
      - name: Prepare verified platform helper
        run: node scripts/prepare-helper.cjs ${{ matrix.platform }} ${{ matrix.arch }}
      - name: Verify Windows helper starts
        if: matrix.platform == 'win32'
        run: '& .\vendor\wxemoticon\wxemoticon.exe --version'
      - name: Prepare offline OCR models
        run: npm run prepare:ocr
      - name: Real offline OCR integration (Windows and macOS)
        if: matrix.platform != 'linux'
        run: npm run test:ocr-engine
      - name: Real offline OCR integration (Linux)
        if: matrix.platform == 'linux'
        run: xvfb-run -a ./node_modules/.bin/electron --no-sandbox scripts/test-ocr-engine.cjs
      - name: Build native paste helper
        # The Windows helper is also exercised before inclusion in installers.
        run: node scripts/build-native.cjs ${{ matrix.arch }}
      - name: Build installer
        run: npm run dist -- --${{ matrix.flag }} --${{ matrix.arch }} --publish never
      - name: SHA-256 checksums
        run: node scripts/checksums.cjs
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: StickerVault-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/SHA256SUMS-*.txt
  release:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/* --clobber
          else
            gh release create "$RELEASE_TAG" release/* --verify-tag --generate-notes --title "StickerVault $RELEASE_TAG"
          fi
